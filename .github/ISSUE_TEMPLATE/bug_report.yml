name: Bug report
description: Report unexpected behavior with reproduction details.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Report vulnerabilities privately through SECURITY.md. Remove keys, tokens, and sensitive log content."
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include your OS, app version, Docker version, connection mode (HTTP/HTTPS/mTLS/SSH), and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized errors or screenshots
