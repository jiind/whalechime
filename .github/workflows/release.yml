name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'scripts/package-release.py'
      - 'tests/release/**'
      - 'desktop/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the version and release source
        id: version
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
        run: |
          python3 scripts/package-release.py --version "$VERSION" --validate-only
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test package layout and version validation
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v

  validate:
    needs: prepare
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    needs: prepare
    name: package (${{ matrix.goos }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run native Go checks
        shell: bash
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build the release archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: python scripts/package-release.py --version "$VERSION" --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, validate, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify all targets and create checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          targets = [('linux', 'amd64'), ('windows', 'amd64'), ('darwin', 'amd64'), ('darwin', 'arm64')]
          expected = {f'whalechime_{version}_{system}_{arch}' + ('.zip' if system == 'windows' else '.tar.gz') for system, arch in targets}
          files = sorted(Path('dist').iterdir())
          if {path.name for path in files} != expected or not all(path.is_file() for path in files):
              raise SystemExit('The release artifact set is incomplete or contains unexpected files')
          lines = [f'{hashlib.file_digest(path.open("rb"), "sha256").hexdigest()}  {path.name}\n' for path in files]
          Path('dist/SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Publish the verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          options=(--verify-tag --generate-notes --title "$VERSION")
          without_metadata="${VERSION%%+*}"
          if [[ "$without_metadata" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" dist/* "${options[@]}"
