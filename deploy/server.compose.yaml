name: whalechime

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: whalechime
      POSTGRES_DB: whalechime
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?서버 설정을 먼저 생성하세요}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whalechime -d whalechime"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  server:
    image: whalechime-server:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    environment:
      DATABASE_URL: "postgres://whalechime:${POSTGRES_PASSWORD}@postgres:5432/whalechime?sslmode=disable"
      WHALECHIME_ADMIN_TOKEN: "${WHALECHIME_ADMIN_TOKEN:?관리자 토큰이 필요합니다}"
      WHALECHIME_ENCRYPTION_KEY: "${WHALECHIME_ENCRYPTION_KEY:?수신처 암호화 키가 필요합니다}"
      WHALECHIME_ALLOWED_NOTIFICATION_HOSTS: "${WHALECHIME_ALLOWED_NOTIFICATION_HOSTS:-}"
    ports:
      - "${WHALECHIME_BIND_ADDRESS:-127.0.0.1}:${WHALECHIME_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/whalechime", "-healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
